[project]
name = "omop-lab"
version = "0.1.0"
description = "Synthea → OMOP CDM 5.4 학습용 ETL과 KCD 용어 매핑 측정"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
omoplab = "omoplab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omoplab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: 실행 중인 Postgres가 필요한 통합 테스트"]
