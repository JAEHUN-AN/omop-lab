services:
  db:
    image: postgres:16
    container_name: omop-lab-db
    environment:
      POSTGRES_DB: omop
      POSTGRES_USER: omop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omop -d omop"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
